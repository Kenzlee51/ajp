---

- name: copy sentinel to VM
  ansible.builtin.copy:
    src: ~/forsonas/sentinel/{{ sentinel_version }}
    dest: "{{ tools_dir }}/sentinel"
    remote_src: yes
    owner: root
    group: root
    mode: '755'
    
- name: install sentinel
  ansible.builtin.apt:
    deb: "{{ tools_dir }}/sentinel/{{ sentinel_version }}"